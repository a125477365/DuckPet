[project]
name = "duckpet"
version = "0.1.0"
description = "插件化开源宠物机器鸭：声纹认主、优先级指令仲裁、跟随、踢球、叼物、治愈系性格"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
dependencies = []

[project.optional-dependencies]
# 语音管线：唤醒词 + 中文流式 ASR + 声纹（一个框架全包）
audio = ["sherpa-onnx>=1.12", "sounddevice>=0.5", "numpy>=1.26"]
# 声源定位（4 麦克风阵列）
doa = ["pyroomacoustics>=0.8", "numpy>=1.26"]
# 视觉：人脸识别 / 人体跟踪 / 开放词汇检测 / 光流避障
vision = [
    "insightface>=0.7",
    "onnxruntime>=1.18",
    "ultralytics>=8.3",
    "boxmot>=13",
    "opencv-python>=4.10",
    "numpy>=1.26",
]
# 中文 TTS（离线）
tts = ["piper-tts>=1.3"]
# 本地小 LLM 指令解析（可选增强）
llm = ["ollama>=0.6"]
# 悬崖检测传感器（VL53L0X，树莓派上安装）
hw = ["adafruit-circuitpython-vl53l0x>=3.6", "adafruit-blinka>=8.0"]

[project.scripts]
duckpet = "duckpet.main:main"
duckpet-enroll = "tools.enroll:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["duckpet*"]
