# DuckPet 上游开源组件注册表
# 这是"持续集成别人开源成果"的核心：每个条目声明一个能力插件的上游来源。
# 运行 `python3 tools/update_plugins.py` 会逐个检查上游是否有新版本/新提交，
# 有更新时提示并可一键更新 pinned 字段与 pip 依赖。
#
# kind:
#   pip       —— pip 包，更新 = pip install -U
#   git       —— 需要 clone 的上游仓库（硬件运行时等）
#   hf-model  —— Hugging Face / ModelScope 模型，更新 = 重新下载
#   asset     —— 素材资源（音效等）

# ---------- 机器人本体 / 运动策略 ----------
[[plugin]]
capability = "platform.openduck"
name = "Open Duck Mini Runtime"
repo = "apirrone/Open_Duck_Mini_Runtime"
kind = "git"
ref = "v2"
pinned = ""
license = "未声明(集成前请确认)"
notes = "树莓派鸭子 RL 行走运行时，适配器 duckpet.hardware.openduck"

[[plugin]]
capability = "platform.openduck"
name = "Open Duck Mini (硬件/预训练行走策略)"
repo = "apirrone/Open_Duck_Mini"
kind = "git"
ref = "v2"
pinned = ""
license = "Apache-2.0"
notes = "BEST_WALK_ONNX_2.onnx 预训练行走策略"

[[plugin]]
capability = "policy.kick_carry"
name = "microduck_rl 踢球/喙叼策略训练管线"
repo = "pollen-robotics/microduck_rl"
kind = "git"
ref = "main"
pinned = ""
license = "Apache-2.0"
notes = "含 BallKick / GroundPick 任务，可训出 ONNX 策略给鸭子用"

[[plugin]]
capability = "platform.microduck"
name = "microduck 运行时 (robotctl)"
repo = "pollen-robotics/microduck"
kind = "git"
ref = "main"
pinned = ""
license = "Apache-2.0"
notes = "Pollen 成品鸭固件；适配器 duckpet.hardware.microduck 通过 robotctl CLI 驱动"

